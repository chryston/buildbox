name: CI

# PR checks and the run the Pages deploy waits on (#35, #20 §12).
# Later steps land here rather than in a second workflow:
#   npm run bench (benchmarks issue).
# Screenshot baselines and their label guard are here too (#39).
# Firefox and WebKit are nightly-only (#38, #20 §9.4): see nightly.yml.

on:
  pull_request:
    # labeled/unlabeled exist for screenshot-guard alone (#39 §4): applying the
    # update-snapshots label has to re-run the check that reads it.
    types: ["opened", "synchronize", "reopened", "labeled", "unlabeled"]
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    # A label change is only interesting to screenshot-guard; e2e-chromium and screenshots
    # hang off this job, so skipping it skips them too.
    if: ${{ !contains(fromJSON('["labeled", "unlabeled"]'), github.event.action) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: node version
        run: node --version
      - name: install
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: browser
        # `npm test` includes the `persistence-browser` project, which drives real Chromium
        # through @vitest/browser (#46). The e2e job installs its own copy.
        run: npx playwright install --with-deps chromium
      - name: test
        run: npm test
      - name: test (renovation flag on)
        # #69 ships dark, and one Vitest run carries one flag value, so the suites that exercise a
        # Design Option are a second run rather than a second project of the first.
        run: npm run test:renovation
      - name: build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # Real-browser smoke on Chromium against `vite preview` of the build verify produced
  # (#38, #20 §9.4). Add "CI / e2e-chromium" to the branch's required status checks
  # alongside "CI / verify".
  e2e-chromium:
    name: e2e-chromium
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: install
        run: npm ci
      - name: browser
        run: npx playwright install --with-deps chromium
      - name: build
        run: npm run build
      - name: e2e
        run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-chromium
          path: |
            playwright-report/
            test-results/

  # The dark feature's smoke tier (#69 criterion 13). `test:e2e:renovation` builds with
  # `.env.renovation` itself — the flag is baked in at build time, so there is no separate build
  # step and no chance of serving a `dist` that cannot answer the spec — and serves it on its own
  # port. Firefox runs the same spec nightly, the way the flag-off set is split.
  e2e-renovation:
    name: e2e-renovation
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: install
        run: npm ci
      - name: browser
        run: npx playwright install --with-deps chromium
      - name: e2e (renovation flag on)
        run: npm run test:e2e:renovation -- --project=renovation-chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-renovation
          path: |
            playwright-report/
            test-results/

  # Screenshot baselines in the pinned Playwright container (#39, #20 §9.5, §13.15).
  # Add "CI / screenshots" to the branch's required status checks. fetch-depth: 0 so the
  # prototype commits the comparison helper renders are reachable; the runner image already
  # ships Docker. The artifact is always uploaded: it carries the diff images of a failed
  # run and the prototype-compare/ renders reviewers sign off on.
  screenshots:
    name: screenshots
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: screenshots
        run: npm run test:screenshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots
          path: test-results/

  # The dark feature's baselines (#70): the same pinned container and the same zero-tolerance diff,
  # on a build made with `.env.renovation` — a flag-off artifact draws no mode bar, no Display card
  # and no overlay, so these scenes have nothing to be photographed by.
  screenshots-renovation:
    name: screenshots-renovation
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: screenshots (renovation flag on)
        run: npm run test:screenshots:renovation
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: screenshots-renovation
          path: test-results/

  # Baselines move only in a PR that says so (#39 §4). Add "CI / screenshot-guard" to the
  # required status checks: it passes trivially when no baseline changed, and fails when one
  # did and the update-snapshots label is missing.
  screenshot-guard:
    name: screenshot-guard
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: baselines need the update-snapshots label
        env:
          BASE_REF: origin/${{ github.base_ref }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'update-snapshots') }}
        run: |
          changed=$(git diff --name-only "${BASE_REF}"...HEAD -- 'e2e/screenshots/__snapshots__/**' 'e2e/screenshots-renovation/__snapshots__/**')
          if [ -n "${changed}" ] && [ "${HAS_LABEL}" != 'true' ]; then
            echo "::error::Screenshot baselines changed without the update-snapshots label"
            echo "Changed baselines:"
            echo "${changed}"
            echo "Only an intentional visual change may do this, with the reason in the PR"
            echo "description; see e2e/README.md for how to regenerate and label it."
            exit 1
          fi
          echo "changed baselines: $(echo "${changed}" | grep -c . || true); update-snapshots label: ${HAS_LABEL}"
