name: CI

# PR checks and the run the Pages deploy waits on (#35, #20 §12).
# Later steps land here rather than in a second workflow:
#   npm run test:screenshots (#39), npm run bench (benchmarks issue).
# Firefox and WebKit are nightly-only (#38, #20 §9.4): see nightly.yml.

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: node version
        run: node --version
      - name: install
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: test
        run: npm test
      - name: build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist

  # Real-browser smoke on Chromium against `vite preview` of the build verify produced
  # (#38, #20 §9.4). Add "CI / e2e-chromium" to the branch's required status checks
  # alongside "CI / verify".
  e2e-chromium:
    name: e2e-chromium
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: install
        run: npm ci
      - name: browser
        run: npx playwright install --with-deps chromium
      - name: build
        run: npm run build
      - name: e2e
        run: npm run test:e2e -- --project=chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-results-chromium
          path: |
            playwright-report/
            test-results/
