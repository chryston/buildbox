name: CI

# PR checks and the run the Pages deploy waits on (#35, #20 §12).
# Later steps land here rather than in a second workflow:
#   npm run test:e2e (#38), npm run test:screenshots (#39), npm run bench (benchmarks issue).

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: node version
        run: node --version
      - name: install
        run: npm ci
      - name: typecheck
        run: npm run typecheck
      - name: lint
        run: npm run lint
      - name: test
        run: npm test
      - name: build
        run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
